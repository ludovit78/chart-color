<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a1410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chart Color" />
  <title>Chart Color</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="mark">C</div>
        <div>
          <h1>Chart Color</h1>
          <p>Import. Style. Compare. Ask the theory bot.</p>
        </div>
      </div>
      <div>
        <label class="k">Import</label>
        <div class="drop" id="drop">
          <strong>Drop or tap for PDF, OnSong, ChordPro, UG</strong>
          <span>Tap a chord on the chart to see the piano</span>
        </div>
        <input id="file" type="file" hidden accept="*/*" />
      </div>
      <div>
        <label class="k">Chart source</label>
        <textarea class="src" id="src" spellcheck="false" placeholder="Paste a chart…"></textarea>
        <div class="actions">
          <button class="btn ghost" id="clearSrc" type="button">Clear source</button>
          <button class="btn ghost" id="saveLib" type="button">Save to library</button>
        </div>
        <div class="actions">
          <button class="btn ghost" id="sampleBossa" type="button">Demo bossa</button>
          <button class="btn ghost" id="sampleGrace" type="button">Demo Grace</button>
          <button class="btn ghost" id="pasteClip" type="button">Paste</button>
        </div>
      </div>
      <div>
        <label class="k">Piano style</label>
        <div class="styles" id="styles"></div>
      </div>
      <div>
        <label class="k">How much extra harmony</label>
        <div class="dens" id="dens">
          <button type="button" data-d="0">Paint</button>
          <button type="button" data-d="1">Light</button>
          <button type="button" data-d="2" class="on">Medium</button>
          <button type="button" data-d="3">Full</button>
        </div>
      </div>
      <button class="btn" id="go" type="button">Restyle chart</button>
      <div>
        <label class="k">Library</label>
        <div id="libList" class="lib-list"></div>
        <div class="actions">
          <button class="btn ghost" id="compareBtn" type="button">Compare selected</button>
        </div>
      </div>
      <div class="bot">
        <label class="k">Theory bot</label>
        <div id="botLog" class="bot-log"></div>
        <div class="chips" id="botChips"></div>
        <div class="bot-row">
          <input id="botIn" type="text" placeholder="this song in Em, light jazz style" />
          <button class="btn" id="botGo" type="button">Ask</button>
        </div>
        <div class="actions">
          <button class="btn ghost" id="clearBot" type="button">Clear bot comments</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="toolbar">
        <div>
          <h2 id="pageTitle">Chart</h2>
          <div class="meta-line" id="pageMeta">Tap a chord to open the piano. Library stays on this phone.</div>
        </div>
        <div class="tools">
          <button class="btn ghost" id="dlCho" type="button">ChordPro</button>
          <button class="btn ghost" id="dlOnsong" type="button">OnSong</button>
          <button class="btn ghost" id="dlTxt" type="button">Aligned text</button>
          <button class="btn" id="printBtn" type="button">Print / PDF</button>
        </div>
      </div>
      <div id="compareWrap" class="compare" hidden></div>
      <div class="chart-wrap" id="chart">
        <div class="chart-head">
          <div>
            <h3 id="titleOut">Untitled</h3>
            <div class="by" id="byOut"></div>
          </div>
          <div class="badges">
            <span class="badge" id="badgeKey">Key</span>
            <span class="badge" id="badgeStyle">Style</span>
            <span class="badge" id="badgeDens">Medium</span>
          </div>
        </div>
        <div id="chartBody"></div>
      </div>
    </main>
  </div>
  <div id="pianoSheet" class="piano-sheet" hidden>
    <div class="piano-head">
      <h3 id="pianoName">Chord on Piano</h3>
      <button class="btn ghost" id="pianoClose" type="button">Close</button>
    </div>
    <p id="pianoHint" hidden></p>
    <div id="pianoKb"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script src="harmony.js?v=12"></script>
  <script src="parser.js?v=12"></script>
  <script src="theory.js?v=12"></script>
  <script src="piano.js?v=12"></script>
  <script src="app.js?v=12"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v=12");</script>
</body>
</html>
